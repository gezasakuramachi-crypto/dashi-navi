name: Deploy Position API

on:
  push:
    branches:
      - main
    paths:
      - "proxy/**"
      - ".github/workflows/deploy-position-api.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test position API
        working-directory: proxy
        run: npm test
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy position API
        working-directory: proxy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets set TRACCAR_TOKEN="${{ secrets.TRACCAR_TOKEN }}"
          flyctl deploy --remote-only
      - name: Verify live position relay
        run: |
          curl --fail --retry 5 --retry-all-errors --max-time 30 \
            https://kashima-dashi-position-api-2026.fly.dev/health
          curl --fail --retry 5 --retry-all-errors --max-time 30 \
            "https://kashima-dashi-position-api-2026.fly.dev/api/positions?deviceId=2"
