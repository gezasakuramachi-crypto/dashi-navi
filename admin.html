<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>山車ナビ 管理者テスト</title>
  <style>
    :root { color-scheme: light; --accent:#d91f63; --ink:#202124; }
    * { box-sizing:border-box; }
    body {
      margin:0; padding:24px 16px; background:#f3f5f7; color:var(--ink);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,
        "Hiragino Kaku Gothic ProN",Meiryo,sans-serif;
    }
    main {
      width:min(620px,100%); margin:0 auto; padding:22px;
      border:1px solid #dde2e7; border-radius:18px; background:#fff;
      box-shadow:0 12px 30px rgba(0,0,0,.09);
    }
    h1 { margin:0 0 8px; font-size:23px; }
    h2 { margin:24px 0 8px; font-size:17px; }
    p { line-height:1.7; }
    .notice {
      padding:10px 12px; border-radius:10px; background:#fff7ed;
      color:#7c3d12; font-size:13px;
    }
    .mode {
      display:flex; gap:10px; margin:10px 0 16px;
    }
    .mode label {
      flex:1; padding:12px; border:1px solid #ccd3da; border-radius:10px;
      cursor:pointer;
    }
    label.field { display:block; margin:12px 0 5px; font-weight:700; font-size:13px; }
    input[type="datetime-local"], textarea {
      width:100%; padding:10px; border:1px solid #cbd2d9; border-radius:9px;
      font:inherit;
    }
    textarea { min-height:130px; font-family:ui-monospace,SFMono-Regular,Consolas,monospace; font-size:12px; }
    .actions { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:16px; }
    button, a.button {
      min-height:44px; padding:10px 12px; border:1px solid var(--accent);
      border-radius:10px; background:#fff; color:#a80f46; font:inherit;
      font-weight:750; text-align:center; text-decoration:none; cursor:pointer;
    }
    button.primary { background:var(--accent); color:#fff; }
    #saved { min-height:1.4em; color:#166534; font-size:13px; }
    @media (max-width:520px) { .actions { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main>
    <h1>山車ナビ 管理者テスト</h1>
    <p>通常モードと、指定日時で交通規制の切替を確認するテストモードを選べます。</p>
    <p class="notice">この画面の保存内容は、この端末の確認用です。一般公開ページ全体のモードは <code>data/runtime-config.json</code> で管理します。</p>

    <h2>この端末のプレビュー設定</h2>
    <div class="mode">
      <label><input type="radio" name="mode" value="normal"> 通常モード</label>
      <label><input type="radio" name="mode" value="test"> テストモード</label>
    </div>

    <label class="field" for="testDateTime">テスト日時（日本時間）</label>
    <input id="testDateTime" type="datetime-local" value="2026-09-01T16:30">

    <div class="actions">
      <button id="save" class="primary" type="button">設定を保存</button>
      <a class="button" href="index.html?preview=1">プレビューを開く</a>
      <a class="button" href="index.html">通常表示を開く</a>
      <button id="reset" type="button">保存設定を消去</button>
    </div>
    <p id="saved" role="status"></p>

    <h2>公開設定用JSON</h2>
    <p>サイト全体を切り替える際に使用する設定内容です。</p>
    <textarea id="publicJson" readonly></textarea>
    <div class="actions">
      <button id="copy" type="button">JSONをコピー</button>
    </div>
  </main>

  <script src="traffic-schedule.js"></script>
  <script src="config.js"></script>
  <script>
    (function () {
      const key = window.DASHI_NAVI_CONFIG.adminPreviewStorageKey;
      const modeInputs = Array.from(document.querySelectorAll('input[name="mode"]'));
      const dateInput = document.getElementById("testDateTime");
      const saved = document.getElementById("saved");
      const publicJson = document.getElementById("publicJson");

      function selectedMode() {
        return modeInputs.find((input) => input.checked)?.value || "normal";
      }

      function currentValue() {
        return {
          mode: selectedMode(),
          testDateTime: selectedMode() === "test" ? dateInput.value : null
        };
      }

      function renderJson() {
        publicJson.value = JSON.stringify({
          ...currentValue(),
          updatedAt: new Date().toISOString()
        }, null, 2);
      }

      try {
        const stored = JSON.parse(localStorage.getItem(key) || "null");
        const mode = stored && stored.mode === "test" ? "test" : "normal";
        modeInputs.find((input) => input.value === mode).checked = true;
        if (stored && stored.testDateTime) dateInput.value = stored.testDateTime;
      } catch (error) {
        modeInputs[0].checked = true;
      }
      renderJson();

      modeInputs.forEach((input) => input.addEventListener("change", renderJson));
      dateInput.addEventListener("input", renderJson);

      document.getElementById("save").addEventListener("click", () => {
        const value = currentValue();
        if (value.mode === "test" && !window.DashiNaviTraffic.parseJstDateTime(value.testDateTime)) {
          saved.textContent = "テスト日時を入力してください。";
          return;
        }
        localStorage.setItem(key, JSON.stringify(value));
        saved.textContent = "この端末のプレビュー設定を保存しました。";
        renderJson();
      });

      document.getElementById("reset").addEventListener("click", () => {
        localStorage.removeItem(key);
        modeInputs.find((input) => input.value === "normal").checked = true;
        saved.textContent = "保存設定を消去しました。";
        renderJson();
      });

      document.getElementById("copy").addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(publicJson.value);
          saved.textContent = "公開設定用JSONをコピーしました。";
        } catch (error) {
          publicJson.select();
          saved.textContent = "JSONを選択しました。手動でコピーしてください。";
        }
      });
    })();
  </script>
</body>
</html>
